<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Phòng Khách Sạn Trực Tuyến</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h2>Hotel Booking System</h2>
            <div>
                <a href="index.html">Trang chủ</a>
                <a href="hotel-management.html">Quản lý</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Khối tìm kiếm & Đặt phòng -->
        <section class="booking-search-box">
            <h3>Đặt phòng khách sạn</h3>
            <form id="booking-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Chọn Khách Sạn:</label>
                        <select id="booking-hotel-select" onchange="loadAvailableRooms()" required>
                            <option value="">-- Chọn khách sạn --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Chọn Phòng:</label>
                        <select id="booking-room-select" required>
                            <option value="">-- Chọn phòng --</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày nhận phòng (Check-in):</label>
                        <input type="date" id="check-in-date" required>
                    </div>
                    <div class="form-group">
                        <label>Ngày trả phòng (Check-out):</label>
                        <input type="date" id="check-out-date" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Xác nhận đặt phòng</button>
            </form>
        </section>

        <!-- Khối danh sách đơn đã đặt của người dùng -->
        <section class="my-bookings">
            <h3>Lịch sử đặt phòng của bạn</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách sạn / Phòng</th>
                        <th>Ngày nhận</th>
                        <th>Ngày trả</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="user-booking-list">
                    <tr><td colspan="7">Đang tải lịch sử...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
