<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | HESTORA</title>
  <link rel="icon" type="image/jpeg" href="assets/images/hestora_logo.jpg"><link rel="stylesheet" href="css/style.css?v=20261115-account-theme-v5">
  <style>
    body.recovery-page { --accent-primary: #987545; --accent-hover: #80613a; --color-secondary: #f1eadc; --text-accent: #87683e; }
    html[data-theme="dark"] body.recovery-page { --bg-main: #000; --bg-card: #0a0a0a; --bg-input: #050505; --text-primary: #faf5eb; --text-secondary: #d2cabe; --text-muted: #b0a698; --border-subtle: #333; --border-light: #414141; --border-focus: #d0ad70; --accent-primary: #d0ad70; --accent-hover: #dfc488; --color-secondary: #1b1916; --text-accent: #e0c58e; background: #000; }
    .recovery-wrap { --recovery-card-bg: rgba(255,255,255,.94); --recovery-card-border: #ded5c5; min-height: calc(100svh - 96px); display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 50% 0%, #e8dfcf 0, #f7f4ed 52%, #eae5dc 100%); transition: background .25s ease; }
    html[data-theme="dark"] .recovery-wrap { --recovery-card-bg: #0a0a0a; --recovery-card-border: #383838; background: #000; }
    .recovery-card { width: min(100%, 520px); padding: 28px 30px; background: var(--recovery-card-bg); border: 1px solid var(--recovery-card-border); box-shadow: 0 22px 60px rgba(32,35,40,.13); backdrop-filter: blur(12px); }
    html[data-theme="dark"] .recovery-card { box-shadow: 0 24px 70px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.025) inset; }
    html[data-theme="dark"] body.recovery-page .site-header { background: #050505; border-bottom-color: #303030; }
    html[data-theme="dark"] body.recovery-page .brand-name { color: #faf5eb; }
    html[data-theme="dark"] body.recovery-page .brand-tagline { color: #d0ad70; }
    html[data-theme="dark"] body.recovery-page .nav-link { color: #e0d8ca; }
    html[data-theme="dark"] body.recovery-page .recovery-icon { color: #e0bd7e; background: #201b13; }
    html[data-theme="dark"] body.recovery-page .recovery-card .form-label { color: #e2d9ca; }
    html[data-theme="dark"] body.recovery-page .recovery-card .btn-primary { color: #241c12; background: linear-gradient(110deg, #e2c68f, #c19a5d); box-shadow: 0 8px 24px rgba(193,154,93,.26); }
    html[data-theme="dark"] body.recovery-page .recovery-card .btn-primary:hover { background: linear-gradient(110deg, #ecd3a2, #d1ad72); box-shadow: 0 12px 28px rgba(193,154,93,.34); }
    .recovery-back { display: inline-flex; margin-bottom: 16px; color: var(--text-secondary); font-size: .88rem; text-decoration: none; }
    .recovery-back:hover { color: var(--accent-primary); }
    .recovery-heading { display: flex; align-items: center; gap: 15px; margin-bottom: 9px; }
    .recovery-icon { display: grid; width: 46px; height: 46px; flex: 0 0 46px; place-items: center; border-radius: 50%; color: var(--accent-primary); background: var(--color-secondary); }
    .recovery-icon svg { width: 22px; height: 22px; }
    .recovery-card h1 { margin: 0; color: var(--text-primary); font: 600 clamp(1.65rem, 4vw, 2rem)/1.2 var(--font-serif); }
    .recovery-intro { margin: 0 0 18px; color: var(--text-secondary); font-size: .92rem; }
    .recovery-card .form-group { margin-bottom: 14px; }
    .recovery-card .form-control { color: var(--text-primary); background: var(--bg-input); border: 1px solid var(--border-subtle); }
    .recovery-card .form-control:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 20%, transparent); }
    .recovery-card .btn-primary { width: 100%; min-height: 46px; color: #fffdf8; background: linear-gradient(110deg, #b49360, #967444); box-shadow: 0 8px 18px rgba(150,116,68,.22); }
    #recoveryMessage { min-height: 24px; margin: 12px 0 0; overflow-wrap: anywhere; font-size: .9rem; }
    #recoveryMessage.is-success { color: #246b45; }
    #recoveryMessage.is-error { color: #a3211b; }
    html[data-theme="dark"] #recoveryMessage.is-success { color: #9dccaa; }
    html[data-theme="dark"] #recoveryMessage.is-error { color: #f1a49a; }
    #loginAfterRecovery { display: none; margin-top: 12px; color: var(--accent-primary); font-weight: 600; text-decoration: none; }
    #loginAfterRecovery:hover { text-decoration: underline; }
    .theme-switch { right: 24px; bottom: 24px; min-width: 116px; min-height: 48px; justify-content: center; padding: 9px 13px; gap: 10px; border: 1px solid #d9c9a8; border-radius: 999px; color: #74674f; background: rgba(250,248,242,.94); box-shadow: 0 8px 26px rgba(44,37,24,.14); backdrop-filter: blur(14px); }
    html[data-theme="dark"] .theme-switch { border-color: #66563b; color: #d8c8a8; background: rgba(35,33,29,.94); }
    .theme-switch > svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .55; }
    .theme-switch > svg:first-child { color: #ad7930; }
    .theme-switch > svg:last-child { color: #777f8b; }
    html[data-theme="dark"] .theme-switch > svg:first-child { color: #d9b66f; }
    html[data-theme="dark"] .theme-switch > svg:last-child { color: #d8c18f; }
    html:not([data-theme="dark"]) .theme-switch > svg:first-child, html[data-theme="dark"] .theme-switch > svg:last-child { opacity: 1; }
    .theme-switch-track { width: 42px; height: 24px; padding: 3px; flex: 0 0 42px; border-radius: 999px; background: #e4dccb; }
    .theme-switch[aria-pressed="true"] .theme-switch-track { background: #a7834e; }
    .theme-switch-thumb { width: 18px; height: 18px; background: #fffdf8; }
    .theme-switch[aria-pressed="true"] .theme-switch-thumb { transform: translateX(18px); }
    @media (max-width: 520px) { .recovery-wrap { min-height: calc(100svh - 76px); padding: 14px 14px 72px; } .recovery-card { padding: 24px 20px; } }
  </style>
</head>
<body class="recovery-page">
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></symbol>
  </svg>
  <button class="theme-switch" id="themeToggle" type="button" aria-label="Chuyển sang giao diện tối" aria-pressed="false">
    <svg aria-hidden="true"><use href="#sun-icon"></use></svg><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span><svg aria-hidden="true"><use href="#moon-icon"></use></svg>
  </button>
  <header class="site-header"><div class="container header-container"><a href="index.html" class="brand-logo"><img src="assets/images/hestora_logo.jpg" alt="HESTORA" class="brand-logo-img"><div class="brand-text-block"><span class="brand-name">HESTORA</span><span class="brand-tagline">YOUR STAY, YOUR STORY</span></div></a><a href="index.html" class="nav-link">Trang chủ</a></div></header>
  <main class="recovery-wrap account-page-shell"><section class="recovery-card account-page-card">
    <a class="recovery-back" href="index.html?auth=login">← Quay lại đăng nhập</a>
    <div class="recovery-heading"><span class="recovery-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></span><h1>Quên mật khẩu?</h1></div>
    <p class="recovery-intro">Nhập email đã đăng ký để cấp mật khẩu tạm. Dùng mật khẩu đó để đăng nhập, sau đó vào Đổi mật khẩu để đặt mật khẩu mới.</p>
    <form id="recoveryForm"><div class="form-group"><label class="form-label" for="recoveryEmail">Địa chỉ email</label><input class="form-control" type="email" id="recoveryEmail" autocomplete="email" required></div><button class="btn-pill btn-primary" id="recoverySubmit" type="submit">Cấp mật khẩu tạm</button><p id="recoveryMessage" role="status" aria-live="polite"></p><a id="loginAfterRecovery" href="index.html?auth=login">Đăng nhập bằng mật khẩu tạm →</a></form>
  </section></main>
  <script src="js/theme-toggle.js?v=20261115-theme-toggle-v2"></script>
  <script>
    const recoveryEmailInput = document.getElementById('recoveryEmail');
    recoveryEmailInput.value = new URLSearchParams(window.location.search).get('email') || '';
    document.getElementById('recoveryForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('recoverySubmit');
      const message = document.getElementById('recoveryMessage');
      button.disabled = true; button.textContent = 'Đang gửi...'; message.textContent = '';
      try {
        const response = await fetch('http://localhost:8080/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('recoveryEmail').value.trim() })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || 'Không thể đặt lại mật khẩu.');
        message.textContent = result.message || 'Yêu cầu đặt lại mật khẩu đã được tiếp nhận.';
        message.className = 'is-success';
        const loginLink = document.getElementById('loginAfterRecovery');
        loginLink.href = `index.html?auth=login&email=${encodeURIComponent(recoveryEmailInput.value.trim())}`;
        loginLink.style.display = 'inline-block';
      } catch (error) {
        message.textContent = error.message || 'Không kết nối được máy chủ. Vui lòng thử lại.';
        message.className = 'is-error';
      } finally { button.disabled = false; button.textContent = 'Cấp mật khẩu tạm'; }
    });
  </script>
</body>
</html>
