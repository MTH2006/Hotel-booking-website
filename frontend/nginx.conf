server {
    listen 3000;
    server_name localhost;

    # Handle common typo or spaces in URLs (DO NOT match admin-dashboard.html)
    location = "/admin dashboard.html" {
        return 301 /admin-dashboard.html;
    }

    location = "/admin_dashboard.html" {
        return 301 /admin-dashboard.html;
    }

    location = "/staff dashboard.html" {
        return 301 /staff-dashboard.html;
    }

    location = "/staff_dashboard.html" {
        return 301 /staff-dashboard.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

