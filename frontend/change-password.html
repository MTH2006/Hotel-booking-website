<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | HESTORA</title>
  <link rel="icon" type="image/jpeg" href="assets/images/hestora_logo.jpg">
  <link rel="stylesheet" href="css/style.css?v=20261115-account-theme-v5">
  <style>
    body.change-password-page { --accent-primary: #987545; --accent-hover: #80613a; --color-secondary: #f1eadc; --text-accent: #87683e; }
    html[data-theme="dark"] body.change-password-page { --bg-main: #000; --bg-card: #0a0a0a; --bg-input: #050505; --text-primary: #faf5eb; --text-secondary: #d2cabe; --text-muted: #b0a698; --border-subtle: #333; --border-light: #414141; --border-focus: #d0ad70; --accent-primary: #d0ad70; --accent-hover: #dfc488; --color-secondary: #1b1916; --text-accent: #e0c58e; background: #000; }
    .change-password-wrap { --account-card-bg: rgba(255,255,255,.94); --account-card-border: #ded5c5; --account-input-bg: #fffefa; --account-input-border: #d4cabb; min-height: calc(100svh - 96px); display: grid; place-items: center; padding: 18px 20px; background: radial-gradient(ellipse at 50% 0%, #e8dfcf 0, #f7f4ed 52%, #eae5dc 100%); transition: background .25s ease; }
    html[data-theme="dark"] .change-password-wrap { --account-card-bg: #0a0a0a; --account-card-border: #383838; --account-input-bg: #050505; --account-input-border: #3c3c3c; background: #000; }
    .change-password-card { width: min(100%, 520px); padding: 26px 30px; background: var(--account-card-bg); border: 1px solid var(--account-card-border); border-radius: var(--radius-lg); box-shadow: 0 22px 60px rgba(45,39,29,.12), 0 2px 8px rgba(45,39,29,.04); backdrop-filter: blur(12px); transition: background .25s ease, border-color .25s ease, box-shadow .25s ease; }
    html[data-theme="dark"] .change-password-card { box-shadow: 0 24px 70px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.025) inset; }
    html[data-theme="dark"] body.change-password-page .site-header { background: #050505; border-bottom-color: #303030; }
    html[data-theme="dark"] body.change-password-page .brand-name { color: #faf5eb; }
    html[data-theme="dark"] body.change-password-page .brand-tagline { color: #d0ad70; }
    html[data-theme="dark"] body.change-password-page .nav-link { color: #e0d8ca; }
    html[data-theme="dark"] body.change-password-page .change-password-icon { color: #e0bd7e; background: #201b13; }
    html[data-theme="dark"] body.change-password-page .change-password-card .form-label { color: #e2d9ca; }
    html[data-theme="dark"] body.change-password-page .change-password-card .btn-primary { color: #241c12; background: linear-gradient(110deg, #e2c68f, #c19a5d); box-shadow: 0 8px 24px rgba(193,154,93,.26); }
    html[data-theme="dark"] body.change-password-page .change-password-card .btn-primary:hover { background: linear-gradient(110deg, #ecd3a2, #d1ad72); box-shadow: 0 12px 28px rgba(193,154,93,.34); }
    html[data-theme="dark"] body.change-password-page .password-toggle:hover, html[data-theme="dark"] body.change-password-page .password-toggle.is-revealing { color: #f0d39b; background: #211c13; }
    .change-password-heading { display: flex; align-items: center; gap: 15px; margin-bottom: 6px; }
    .change-password-icon { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 44px; color: var(--accent-primary); background: var(--color-secondary); border-radius: 50%; }
    .change-password-icon svg { width: 22px; height: 22px; }
    .change-password-card h1 { margin: 0; color: var(--text-primary); font: 600 clamp(1.65rem, 4vw, 2rem)/1.2 var(--font-serif); }
    .change-password-intro { margin: 0 0 18px; color: var(--text-secondary); font-size: .92rem; }
    .change-password-card .form-group { margin-bottom: 12px; }
    .change-password-card .form-label { margin-bottom: 5px; }
    .password-field { position: relative; }
    .password-field .form-control { height: 44px; padding-right: 48px; color: var(--text-primary); background: var(--account-input-bg); border-color: var(--account-input-border); transition: background .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .password-field .form-control:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 20%, transparent); }
    html:not([data-theme="dark"]) .change-password-card .form-label { color: #5c5142; }
    .password-toggle { position: absolute; top: 50%; right: 8px; display: grid; width: 34px; height: 34px; place-items: center; transform: translateY(-50%); border: 0; border-radius: 50%; color: var(--text-secondary); background: transparent; cursor: pointer; }
    .password-toggle:hover, .password-toggle:focus-visible { color: var(--accent-primary); background: var(--color-secondary); outline: none; }
    .password-toggle svg { width: 19px; height: 19px; }
    .change-password-card .btn-primary { width: 100%; min-height: 44px; margin-top: 2px; color: #fffdf8; background: linear-gradient(110deg, #b49360, #967444); box-shadow: 0 8px 18px rgba(150,116,68,.22); transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .change-password-card .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 11px 24px color-mix(in srgb, var(--accent-primary) 28%, transparent); }
    .password-message { min-height: 24px; margin: 12px 0 0 !important; font-size: .9rem; }
    .forgot-password-link { display: block; margin-top: 10px; color: var(--accent-primary); text-align: center; font-size: .9rem; text-decoration: none; }
    .forgot-password-link:hover { text-decoration: underline; }
    .change-password-back { display: inline-flex; margin-bottom: 16px; color: var(--text-secondary); font-size: .88rem; text-decoration: none; }
    .change-password-back:hover { color: var(--accent-primary); }
    .password-toggle.is-revealing { color: var(--accent-primary); background: var(--color-secondary); }
    .theme-switch { right: 24px; bottom: 24px; min-width: 116px; min-height: 48px; justify-content: center; padding: 9px 13px; gap: 10px; border: 1px solid #d9c9a8; border-radius: 999px; color: #74674f; background: rgba(250,248,242,.94); box-shadow: 0 8px 26px rgba(44,37,24,.14); backdrop-filter: blur(14px); transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
    html[data-theme="dark"] .theme-switch { border-color: #66563b; color: #d8c8a8; background: rgba(35,33,29,.94); box-shadow: 0 10px 30px rgba(0,0,0,.32), 0 1px 0 rgba(228,204,157,.07) inset; }
    .theme-switch:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(44,37,24,.2); }
    html[data-theme="dark"] .theme-switch:hover { box-shadow: 0 14px 34px rgba(0,0,0,.4), 0 1px 0 rgba(228,204,157,.1) inset; }
    .theme-switch:focus-visible { outline: 3px solid rgba(197,164,109,.42); outline-offset: 3px; }
    .theme-switch > svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .55; transition: color .2s ease, opacity .2s ease, transform .2s ease; }
    .theme-switch > svg:first-child { color: #ad7930; }
    .theme-switch > svg:last-child { color: #777f8b; }
    html[data-theme="dark"] .theme-switch > svg:first-child { color: #d9b66f; }
    html[data-theme="dark"] .theme-switch > svg:last-child { color: #d8c18f; }
    html:not([data-theme="dark"]) .theme-switch > svg:first-child, html[data-theme="dark"] .theme-switch > svg:last-child { opacity: 1; transform: scale(1.08); }
    .theme-switch-track { width: 42px; height: 24px; padding: 3px; flex: 0 0 42px; border-radius: 999px; background: #e4dccb; box-shadow: inset 0 1px 3px rgba(75,59,31,.2); transition: background .2s ease; }
    .theme-switch[aria-pressed="true"] .theme-switch-track { background: #a7834e; }
    .theme-switch-thumb { width: 18px; height: 18px; background: #fffdf8; box-shadow: 0 2px 5px rgba(45,35,20,.25); }
    .theme-switch[aria-pressed="true"] .theme-switch-thumb { transform: translateX(18px); }
    @media (prefers-reduced-motion: reduce) { .change-password-wrap, .change-password-card, .password-field .form-control, .change-password-card .btn-primary, .theme-switch { transition: none; } }
    @media (max-width: 520px) { .change-password-wrap { min-height: calc(100svh - 76px); padding: 14px 14px 72px; } .change-password-card { padding: 24px 20px; } }
  </style>
</head>
<body class="change-password-page">
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="flashlight-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3h8l1.5 4h-11L8 3Z"/><path d="M7 7h10l-1.5 10h-7L7 7Z"/><path d="M10 17h4v4h-4z"/><path d="m5 3-2-1M19 3l2-1"/>
    </symbol>
    <symbol id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></symbol>
  </svg>
  <button class="theme-switch" id="themeToggle" type="button" aria-label="Chuyển sang giao diện tối" aria-pressed="false">
    <svg aria-hidden="true"><use href="#sun-icon"></use></svg>
    <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span>
    <svg aria-hidden="true"><use href="#moon-icon"></use></svg>
  </button>
  <header class="site-header"><div class="container header-container">
    <a href="index.html" class="brand-logo"><img src="assets/images/hestora_logo.jpg" alt="HESTORA" class="brand-logo-img"><div class="brand-text-block"><span class="brand-name">HESTORA</span><span class="brand-tagline">YOUR STAY, YOUR STORY</span></div></a>
    <a href="index.html" class="nav-link">Trang chủ</a>
  </div></header>
  <main class="change-password-wrap account-page-shell">
    <section class="change-password-card account-page-card">
      <a class="change-password-back" href="index.html">← Quay lại trang chủ</a>
      <div class="change-password-heading">
        <span class="change-password-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3"/></svg></span>
        <h1>Đổi mật khẩu</h1>
      </div>
      <p class="change-password-intro">Cập nhật mật khẩu để giữ an toàn cho tài khoản Hestora của bạn.</p>
      <form id="changePasswordForm">
        <div class="form-group"><label class="form-label" for="oldPassword">Mật khẩu hiện tại</label><div class="password-field"><input class="form-control" id="oldPassword" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" data-target="oldPassword"><svg aria-hidden="true"><use href="#flashlight-icon"></use></svg></button></div></div>
        <div class="form-group"><label class="form-label" for="newPassword">Mật khẩu mới</label><div class="password-field"><input class="form-control" id="newPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" data-target="newPassword"><svg aria-hidden="true"><use href="#flashlight-icon"></use></svg></button></div></div>
        <div class="form-group"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label><div class="password-field"><input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" data-target="confirmPassword"><svg aria-hidden="true"><use href="#flashlight-icon"></use></svg></button></div></div>
        <button class="btn-pill btn-primary" id="submitPassword" type="submit">Cập nhật mật khẩu</button>
        <p class="password-message" id="passwordMessage" role="status" aria-live="polite"></p>
      </form>
      <a class="forgot-password-link" href="forgot-password.html">Quên mật khẩu?</a>
    </section>
  </main>
  <script src="js/theme-toggle.js?v=20261115-theme-toggle-v2"></script>
  <script>
    (() => {
      const user = JSON.parse(localStorage.getItem('hotel_user') || 'null');
      const form = document.getElementById('changePasswordForm');
      const message = document.getElementById('passwordMessage');
      const button = document.getElementById('submitPassword');
      document.querySelectorAll('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        toggle.classList.toggle('is-revealing', show);
      }));
      if (!user?.token) {
        message.textContent = 'Bạn cần đăng nhập trước khi đổi mật khẩu.';
        message.style.color = '#e49b8e';
        button.textContent = 'Đăng nhập để tiếp tục';
        button.addEventListener('click', () => {
          window.location.href = 'index.html?auth=login&next=change-password.html';
        });
        document.querySelector('.forgot-password-link').style.display = 'none';
        return;
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) {
          message.textContent = 'Mật khẩu xác nhận không khớp.';
          message.style.color = '#e49b8e';
          return;
        }
        button.disabled = true;
        button.textContent = 'Đang cập nhật...';
        message.textContent = '';
        try {
          const response = await fetch('http://localhost:8080/api/auth/change-password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${user.token}` },
            body: JSON.stringify({ oldPassword, newPassword })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.message || 'Không thể đổi mật khẩu, vui lòng thử lại.');
          form.reset();
          message.textContent = result.message || 'Đổi mật khẩu thành công!';
          message.style.color = '#9dccaa';
        } catch (error) {
          message.textContent = error.message || 'Không kết nối được máy chủ. Vui lòng thử lại.';
          message.style.color = '#e49b8e';
        } finally {
          button.disabled = false;
          button.textContent = 'Cập nhật mật khẩu';
        }
      });
    })();
  </script>
</body>
</html>
