version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service [FR-1 to FR-96 Database Engine]
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hotel-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_secure_password_2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hotel_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_user} -d ${POSTGRES_DB:-hotel_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hotel-network

  # ============================================================================
  # 2. pgAdmin 4 - Quản lý và Trình bày Database Trực quan
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel-booking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hotelbooking.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./database/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel-network

  # ============================================================================
  # 3. Spring Boot Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-booking-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hotel_booking_db}
      DB_USERNAME: ${POSTGRES_USER:-hotel_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_secure_password_2025}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel-network

  # ============================================================================
  # 4. Frontend Web Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-booking-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - hotel-network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  hotel_db_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
